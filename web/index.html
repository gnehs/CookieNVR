<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var m = localStorage.getItem("cookienvr.color-scheme");
        if (m === "light" || m === "dark") document.querySelector('meta[name="color-scheme"]').content = m;
        var a = localStorage.getItem("cookienvr.accent");
        if (a) document.documentElement.dataset.accent = a;
        if (localStorage.getItem("cookienvr.sidebar") === "collapsed") document.documentElement.dataset.sidebar = "collapsed";
      } catch (e) {}
    </script>
    <title>CookieNVR</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <script type="module" src="./main.tsx"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
