<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var m = localStorage.getItem("cookienvr.color-scheme");
        if (m === "light" || m === "dark") document.querySelector('meta[name="color-scheme"]').content = m;
        var a = localStorage.getItem("cookienvr.accent");
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
    <title>CookieNVR</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
