name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MEDIAMTX_VERSION: "1.21.4"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install MediaMTX
        run: |
          file="mediamtx_v${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/bluenviron/mediamtx/releases/download/v${MEDIAMTX_VERSION}"
          curl -fsSL --retry 3 -O "${base}/${file}" -O "${base}/checksums.sha256"
          grep "[ *]${file}\$" checksums.sha256 | sha256sum -c -
          sudo tar -xzf "${file}" -C /usr/local/bin mediamtx
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # 物件辨識 worker：與映像同一份釘住的相依（amd64 會連 OpenVINO plugin 一起裝），下載內建模型後跑單元測試與 CPU 自我檢查。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: detector/requirements.txt
      - run: pip install -r detector/requirements.txt
      - run: python detector/fetch_model.py
      - run: python -m unittest discover -s detector/tests
      - run: scripts/detector-selftest --seconds 2

  # 真的建映像並在容器內走完整條流程（錄影、重啟、docker stop、時區、CPU 物件辨識）。約 8 分鐘，
  # 所以只在 PR 與 main 上跑；它是這個專案唯一會用 Debian 的 ffmpeg 與 amd64 MediaMTX 實際錄影的地方。
  docker-e2e:
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/docker-e2e.ts
