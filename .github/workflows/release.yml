name: Release

# main 每次 push 發 edge（與 edge-nvidia）；v* tag 發版本號與 latest。
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.2.3、1.2、1、latest：CPU，amd64 另含 Intel 內顯
          - variant: default
            suffix: ""
            platforms: linux/amd64,linux/arm64
          # 1.2.3-nvidia、1.2-nvidia、1-nvidia、latest-nvidia：CPU 與 Nvidia（CUDA 12）
          - variant: nvidia
            suffix: "-nvidia"
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Docker image names must be lowercase (the repository is gnehs/CookieNVR).
      # SOURCE_DATE_EPOCH must stay constant: rewrite-timestamp clamps file times to it on every export, cached
      # layers included, so a per-commit value (tried first) gave the 2 GB Python layer a new digest on every
      # push. Fixed, the same content always exports to the same digest. The image's creation date shows this
      # date; the real build time is in the org.opencontainers.image.created label.
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=1767225600" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          build-args: VARIANT=${{ matrix.variant }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build cache lives in GHCR next to the image: GitHub's Actions cache caps a repository at 10 GB,
          # which the two variants exceeded, so evicted layers were rebuilt with new digests and users had to
          # pull the 2 GB Python environment again after unrelated changes.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }},mode=max,image-manifest=true,oci-mediatypes=true
          # File times are clamped to the fixed SOURCE_DATE_EPOCH, so equal content means an equal layer digest.
          outputs: type=image,push=true,rewrite-timestamp=true
